name: Pull Avianca Flight Lookup (Periscope) to Google Sheet

on:
  schedule:
    # Four times a day at 00:07, 06:07, 12:07, 18:07 America/Bogota.
    # Bogota is UTC-5 all year (no DST), so the offset never drifts:
    #   05:07 UTC = 00:07 Bogota
    - cron: '7 5 * * *'
    #   11:07 UTC = 06:07 Bogota
    - cron: '7 11 * * *'
    #   17:07 UTC = 12:07 Bogota
    - cron: '7 17 * * *'
    #   23:07 UTC = 18:07 Bogota
    - cron: '7 23 * * *'
    # :07 rather than :00/:01 - GitHub queues scheduled workflows behind
    # everything scheduled at the top of the hour and runs started 2-4 h
    # late on the sibling pipelines. Even a late run pulls the right days:
    # the scraper computes its D-2..D0 window at run time.
  workflow_dispatch:
    inputs:
      backfill_start:
        description: 'Optional one-off catch-up: first day to re-pull (MM/DD/YYYY)'
        required: false
        default: ''
      backfill_end:
        description: 'Optional one-off catch-up: last day to re-pull (MM/DD/YYYY)'
        required: false
        default: ''
      skip_backfill:
        description: 'Set to "true" to pull only the primary D-2..D0 window'
        required: false
        default: ''

jobs:
  scrape:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          pip install -r requirements.txt
          playwright install --with-deps chromium

      - name: Run scrape and upload
        env:
          SHEETS_WEBAPP_URL: ${{ secrets.SHEETS_WEBAPP_URL }}
          WEBAPP_TOKEN: ${{ secrets.WEBAPP_TOKEN }}
          # Empty on scheduled runs -> the scraper uses its rotating backfill chunk.
          BACKFILL_START: ${{ github.event.inputs.backfill_start }}
          BACKFILL_END: ${{ github.event.inputs.backfill_end }}
          SKIP_BACKFILL: ${{ github.event.inputs.skip_backfill }}
        run: python scrape_and_upload.py

      - name: Upload debug artifacts on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: debug-artifacts
          path: |
            *.png
            *.html
          if-no-files-found: ignore
