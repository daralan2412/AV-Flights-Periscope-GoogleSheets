name: Pull Avianca Flight Lookup (Periscope) to Google Sheet

on:
  schedule:
    # Four times a day at 00:03, 06:03, 12:03, 18:03 America/Bogota.
    # Bogota is UTC-5 all year (no DST), so the offset never drifts:
    #   05:03 UTC = 00:03 Bogota
    - cron: '3 5 * * *'
    #   11:03 UTC = 06:03 Bogota
    - cron: '3 11 * * *'
    #   17:03 UTC = 12:03 Bogota
    - cron: '3 17 * * *'
    #   23:03 UTC = 18:03 Bogota
    - cron: '3 23 * * *'
    # :03 rather than :07 (which every sibling pipeline in this account
    # already uses) or :00/:01, in case shared-minute contention across
    # pipelines is contributing to the delay. Even a late run still pulls
    # the right days: the scraper computes its D-2..D0 window at run time.
  workflow_dispatch:
    inputs:
      backfill_start:
        description: 'Optional one-off catch-up: first day to re-pull (MM/DD/YYYY)'
        required: false
        default: ''
      backfill_end:
        description: 'Optional one-off catch-up: last day to re-pull (MM/DD/YYYY)'
        required: false
        default: ''
      skip_backfill:
        description: 'Set to "true" to pull only the primary D-2..D0 window'
        required: false
        default: ''

jobs:
  scrape:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          pip install -r requirements.txt
          playwright install --with-deps chromium

      - name: Run scrape and upload
        env:
          SHEETS_WEBAPP_URL: ${{ secrets.SHEETS_WEBAPP_URL }}
          WEBAPP_TOKEN: ${{ secrets.WEBAPP_TOKEN }}
          # Empty on scheduled runs -> the scraper uses its rotating backfill chunk.
          BACKFILL_START: ${{ github.event.inputs.backfill_start }}
          BACKFILL_END: ${{ github.event.inputs.backfill_end }}
          SKIP_BACKFILL: ${{ github.event.inputs.skip_backfill }}
        run: python scrape_and_upload.py

      - name: Upload debug artifacts on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: debug-artifacts
          path: |
            *.png
            *.html
          if-no-files-found: ignore
